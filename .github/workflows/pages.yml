# Publie le site sur GitHub Pages à chaque push sur dev, ou à la demande.
# tools/pages.mjs ne garde que les fichiers du site et les adapte au sous-dossier du dépôt.
name: GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Préparer le site
        run: node tools/pages.mjs _site "${{ steps.pages.outputs.base_path }}" "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5
