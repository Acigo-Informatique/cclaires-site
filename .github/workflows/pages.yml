# Publie le site sur GitHub Pages à chaque push sur dev, ou à la demande.
# Astro construit le site dans dist/, puis tools/verifier.mjs le contrôle (H1, liens, règles du contenu) :
# un échec arrête la publication. Tant que le site est servi sous https://<compte>.github.io/<dépôt>/,
# BASE_PATH préfixe ses chemins par ce sous-dossier et les pages restent hors des moteurs de recherche.
name: GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - name: Installer
        run: npm ci
      - name: Construire
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Vérifier
        run: npm run verifier
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@v5
